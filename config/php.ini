; PHP settings for the Wasmer Edge runtime only (loaded via PHPRC in
; wasmer.toml). Nothing here affects local development.
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0

; Platform-level upload caps must sit comfortably above the application's
; 2 MB evidence limit so Laravel's own Indonesian validation stays the
; effective rule users see (spec: evidence upload limits honored on the Edge).
upload_max_filesize = "20M"
post_max_size = "25M"

; Production face: an accidental include/lib warning must never paint HTML
; into a live page (the fakerphp exclusion stink of 2026-11-07 did exactly
; that). PHP's own errors still reach stderr and thus `wasmer app logs`.
display_errors = Off
